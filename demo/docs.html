<!doctype html>

<meta name="color-scheme" content="light dark">
<script>try { document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("mv-site-scheme") || "light dark"; } catch {}</script>
<title>MangaVibe for developers</title>
<meta name="description" content="How MangaVibe is built, how to run it, and how to write a plugin for it.">

<!-- Every developer page of the website is this file (demo/docs.html), written by demo/build.py at the
     page's path (demo/pages.py, DEV_PAGES) next to its Markdown (page.md, a copy of the repo's file),
     with %BASE% and MV_SITE filled in: the way back to the site's root, which file it shows, the
     developer pages and where every doc is on the site. -->
<style>
  /* ---- the menu on the left, the page on the right ---- */
  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 44px; padding-block: 28px 40px; }
  .side { position: sticky; top: 84px; align-self: start; max-height: calc(100dvh - 100px); overflow: auto;
          font-size: 0.9rem; padding-right: 4px; overscroll-behavior: contain; }
  .side summary { display: none; }
  .side .group { margin: 0 0 6px 8px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.07em;
                 text-transform: uppercase; color: var(--muted); }
  .side ol { list-style: none; margin: 0; padding: 0; }
  .side a { display: block; padding: 5px 10px; border-radius: 8px; color: var(--text); text-decoration: none; }
  .side a:hover { background: var(--surface2); }
  .side nav > ol > li > a[aria-current="page"] { color: var(--accent); font-weight: 700; background: var(--accent-soft); }
  .side .back { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border); }
  .side .back a { color: var(--muted); }
  /* this page's sections, under its name */
  .here { scroll-target-group: auto; margin: 4px 0 10px 12px !important; padding-left: 8px !important;
          border-left: 1px solid var(--border); }
  .here .here-sub { margin: 0 0 4px 10px; }
  .here a { color: var(--muted); padding: 3px 8px; font-size: 0.86rem; }
  .here a:is(:target-current, .target-current) { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

  @media (max-width: 960px) {
    html { scroll-padding-top: 76px; }
    .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-top: 16px; }
    .side { position: static; max-height: none; background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 4px 12px 10px; }
    .side summary { display: block; cursor: pointer; padding: 10px 2px; font-weight: 650; }
  }

  /* ---- the page ---- */
  .doc { max-width: 860px; }
  .doc .crumbs { margin: 0 0 6px; font-size: 0.85rem; color: var(--muted); }
  .doc .crumbs a { color: var(--muted); }
  .doc h1 { font-size: clamp(1.9rem, 1.4rem + 1.8vw, 2.5rem); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px; }
  .doc h2 { font-size: 1.5rem; letter-spacing: -0.01em; margin: 48px 0 8px; padding-top: 18px; border-top: 1px solid var(--border); }
  .doc h3 { font-size: 1.12rem; margin: 30px 0 6px; }
  .doc h4 { font-size: 1rem; margin: 22px 0 4px; }
  .doc section:focus { outline: none; }
  .doc p, .doc li { color: color-mix(in srgb, var(--text) 88%, var(--muted)); }
  .doc .edit { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 0.88rem; }

  .loading, .failed { color: var(--muted); }
</style>
</head>
<body>
<a class="sr-only" href="#doc">Skip to the page</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="%BASE%docs/"><svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#111318"/><rect x="12" y="10" width="40" height="44" rx="4" fill="#ff7a59"/><rect x="30.5" y="10" width="3" height="44" fill="#111318"/></svg> MangaVibe</a>
    <nav class="site-nav" aria-label="Site">
      <button class="icon-button menu-button" type="button" popovertarget="site-menu" aria-controls="site-menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span class="sr-only">Menu</span>
      </button>
      <ul id="site-menu" class="site-menu" popover="auto">
        <li><a href="%BASE%docs/#features">Features</a></li>
        <li><a href="%BASE%docs/#install">Install</a></li>
        <li><a href="%BASE%docs/#plugins">Plugins</a></li>
        <li><a href="%BASE%docs/developers/" aria-current="page">Developers</a></li>
        <li><a href="https://github.com/ivokolarov0/manga-vibe">GitHub</a></li>
        <li><a href="%BASE%">Try the demo</a></li>
      </ul>
      <button class="icon-button theme" type="button">
        <span class="to-dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="sr-only">Switch to the dark theme</span></span>
        <span class="to-light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="sr-only">Switch to the light theme</span></span>
      </button>
    </nav>
  </div>

<div class="wrap layout">
  <aside class="side">
    <details id="side-box">
      <summary>Developer docs</summary>
      <nav aria-label="Developer docs" id="side"><p class="group">For developers</p><ol id="side-pages"></ol></nav>
      <p class="back"><a href="%BASE%docs/">← MangaVibe home</a></p>
    </details>
  </aside>
  <main class="doc md" id="doc" tabindex="-1">
    <div id="page"><p class="loading">Loading…</p></div>
  </main>
</div>

<footer class="site-footer">
  <div class="wrap"><p style="margin:0;padding-block:22px">MangaVibe · <a href="https://github.com/ivokolarov0/manga-vibe/blob/main/LICENSE">AGPL-3.0</a> · <a href="https://github.com/ivokolarov0/manga-vibe">Source on GitHub</a></p></div>
</footer>

<script>window.MV_SITE = /*MV_SITE*/{ base: "../", links: null, src: "docs/PLUGIN-REFERENCE.md", pages: null };</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="%BASE%assets/site.js"></script>
<script src="%BASE%assets/md.js"></script>
<script>
"use strict";
const SITE = window.MV_SITE;
const PAGE = SITE.pages.find((p) => p.src === SITE.src) || { title: "MangaVibe", path: "" };
document.title = `${PAGE.title} · MangaVibe for developers`;

/* Each h2/h3 starts a <section> with its id (the menu's targets) */
function build(md) {
  const { root } = MVDoc.render(md, { src: SITE.src });
  const page = document.getElementById("page");
  page.replaceChildren();
  let section = page;
  for (const el of [...root.children]) {
    if (/^H[23]$/.test(el.tagName)) {
      section = document.createElement("section");
      section.id = MVDoc.slug(el.textContent);
      section.tabIndex = -1;
      section.dataset.level = el.tagName[1];
      page.append(section);
    }
    section.append(el);
  }
  const edit = document.createElement("p");
  edit.className = "edit";
  edit.innerHTML = `<a href="${MVDoc.REPO}${SITE.src}">View or edit this page on GitHub</a>`;
  page.append(edit);
  buildSide(page);
  spy(page);
  MVDoc.drawDiagrams(page);
  if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
}

/* The menu: the developer pages; under this one, its sections */
function buildSide(page) {
  const list = document.getElementById("side-pages");
  for (const p of SITE.pages) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = SITE.base + p.path;
    a.textContent = p.title;
    li.append(a);
    if (p.src === SITE.src) {
      a.setAttribute("aria-current", "page");
      li.append(sections(page));
    }
    list.append(li);
  }
  // wide screens: the menu is always open; narrow ones: a box that closes after a pick
  const box = document.getElementById("side-box");
  const wide = matchMedia("(min-width: 961px)");
  const place = () => { box.open = wide.matches; };
  wide.addEventListener("change", place);
  place();
  list.addEventListener("click", (e) => { if (e.target.closest(".here a") && !wide.matches) box.open = false; });
}

function sections(page) {
  const here = document.createElement("ol");
  here.className = "here";
  let sub = null;
  for (const s of page.querySelectorAll("section")) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = `#${s.id}`;
    a.textContent = s.querySelector("h2, h3").textContent;
    li.append(a);
    if (s.dataset.level === "2") {
      here.append(li);
      sub = document.createElement("ol");
      sub.className = "here-sub";
      li.append(sub);
    } else (sub || here).append(li);
  }
  for (const ol of here.querySelectorAll("ol:empty")) ol.remove();
  return here;
}

/* The section on screen is marked under the page's name: :target-current where the browser tracks it
   (scroll-target-group), an IntersectionObserver elsewhere. aria-current follows either way. */
function spy(page) {
  const links = [...document.querySelectorAll(".here a")];
  const mark = (current) => links.forEach((a) => a.setAttribute("aria-current", a === current ? "true" : "false"));
  if (CSS.supports("scroll-target-group: auto")) {
    const sync = () => mark(document.querySelector(".here a:target-current"));
    sync();
    document.addEventListener("scrollend", sync);
    return;
  }
  const byId = new Map(links.map((a) => [a.getAttribute("href").slice(1), a]));
  const observer = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const link = byId.get(entry.target.id);
      links.forEach((a) => a.classList.toggle("target-current", a === link));
      mark(link);
      link?.scrollIntoView({ block: "nearest" });
    }
  }, { rootMargin: "-90px 0px -70% 0px", threshold: 0 });
  page.querySelectorAll("section").forEach((s) => observer.observe(s));
}

fetch("page.md", { cache: "no-cache" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(build)
  .catch((e) => {
    document.getElementById("page").innerHTML = `<p class="failed">This page didn't load (${e.message}).
      Read it <a href="${MVDoc.REPO}${SITE.src}">on GitHub</a>.</p>`;
  });
</script>
</body>
</html>
