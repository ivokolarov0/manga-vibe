# Builds the Android app (android/) when a GitHub release is published, and attaches it to the
# release as MangaVibe.apk. The web app links to releases/latest/download/MangaVibe.apk.
# Run by hand (workflow_dispatch), it builds the chosen branch and keeps the APK as a workflow artifact.
#
# Signing: Android only installs an update over the app if both are signed with the same key, so
# every release must use one key. Add these repository secrets (how: android/README.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them a release fails here; a hand-run build uses a throwaway debug key.
name: Android app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ -n "$TAG" ]; then
              echo "::error::The ANDROID_KEYSTORE_* secrets are missing, see android/README.md"
              exit 1
            fi
            echo "::warning::No signing key: this APK is signed with a throwaway debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MANGAVIBE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          MANGAVIBE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MANGAVIBE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MANGAVIBE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${TAG#v}"
          # versionCode only has to grow from one build to the next: the run number does
          ./gradlew --no-daemon assembleRelease \
            -PversionName="${version:-dev-${GITHUB_SHA::7}}" -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/MangaVibe.apk"

      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/MangaVibe.apk" --clobber

      - uses: actions/upload-artifact@v4
        if: env.TAG == ''
        with:
          name: MangaVibe-apk
          path: ${{ runner.temp }}/MangaVibe.apk
