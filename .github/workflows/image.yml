# Builds the Docker image when a GitHub release is published (Intel and ARM) and publishes it as
# ghcr.io/<owner>/mangavibe and, when the Docker Hub secrets are set, as <DOCKERHUB_USERNAME>/mangavibe.
# Tags: the version without its "v" (v1.4.0 -> 1.4.0), the commit, and `latest` (not for pre-releases).
# Running apps take new code and pip packages from the release by themselves (see app/updater.py);
# the image is only needed by new installs and when the Dockerfile or the entrypoint changed.
# Run by hand (workflow_dispatch), it builds the chosen branch or tag as `latest`.
#
# Docker Hub: add the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token
# with Read & Write, from Docker Hub → Account settings → Personal access tokens). Without them
# only ghcr.io is published.
name: Docker image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      VERSION: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names and tags (lower case)
        id: name
        run: |
          images="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mangavibe"
          if [ -n "$HUB_USER" ]; then images="$images ${HUB_USER,,}/mangavibe"; fi
          {
            echo "tags<<EOF"
            for i in $images; do
              echo "$i:${GITHUB_SHA}"
              if [ -n "$VERSION" ]; then echo "$i:${VERSION#v}"; fi
              if [ "$PRERELEASE" != "true" ]; then echo "$i:latest"; fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: env.HUB_USER != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.name.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
