# For building and testing on a PC. To install the published image, see README.md.
services:
  mangavibe:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}       # set by build.py; tells auto-update which version is built in
    image: mangavibe:latest
    container_name: mangavibe
    ports:
      - "8090:8090"
    volumes:
      - ./dev-library:/manga        # your manga folder (add :ro to turn off Delete series)
      - ./docker-data:/data         # database, covers, cache, plugins
    environment:
      TZ: Europe/Sofia
      LIBRARY_PATHS: /manga
    restart: unless-stopped
