  <!-- ============ edit series ============ -->
  <div class="modal" x-data="editSeries()" x-show="$store.app.edit.open" x-cloak
       x-dialog="close()">
    <div class="edit-dialog">
      <template x-if="s">
        <div>
          <div class="sheet-head"><b x-text="t('Edit · {title}', { title: s.title })"></b><button class="btn small" @click="close()">{{ t("Close") }}</button></div>
          <div class="tabs small" x-tabs>
            <button data-tab="info" :class="{ active: tab === 'info' }" @click="tab = 'info'">{{ t("Info") }}</button>
            <button data-tab="poster" :class="{ active: tab === 'poster' }" @click="tab = 'poster'">{{ t("Poster") }}</button>
          </div>

          <!-- info -->
          <form class="edit-form" data-tab-panel="info" x-show="tab === 'info'" @submit.prevent="save()">
            <!-- plugins' fields, saved with the rest (e.g. Library) -->
            {{ slot("series-edit") }}
            <!-- the UI kit's fields (x-field: the name, the hint and the control tied together) -->
            <div class="field wide" x-field><label>{{ t("English title") }}</label>
              <input x-model="f.title_english" maxlength="300"></div>
            <div class="field" x-field><label>{{ t("Romaji title") }}</label>
              <input x-model="f.title_romaji" maxlength="300"></div>
            <div class="field" x-field><label>{{ t("Native title") }}</label>
              <input x-model="f.title_native" maxlength="300"></div>
            <div class="field wide" x-field><label>{{ t("Other titles") }}</label> <small class="hint">{{ t("one per line") }}</small>
              <textarea rows="3" x-model="f.synonyms"></textarea></div>
            <div class="field wide" x-field><label>{{ t("Description") }}</label>
              <textarea rows="7" x-model="f.description" maxlength="20000"></textarea></div>
            <div class="field" x-field><label>{{ t("Status") }}</label>
              <select x-model="f.publication_status">
                <template x-for="[k, v] in Object.entries(pubLabels)" :key="k"><option :value="k" :selected="k === f.publication_status" x-text="v"></option></template>
              </select></div>
            <div class="field" x-field><label>{{ t("Type") }}</label>
              <select x-model="f.type">
                <option value="">{{ t("Unknown") }}</option><option value="manga">{{ t("Manga") }}</option><option value="manhwa">{{ t("Manhwa") }}</option>
                <option value="manhua">{{ t("Manhua") }}</option><option value="one_shot">{{ t("One-shot") }}</option><option value="novel">{{ t("Novel") }}</option>
              </select></div>
            <div class="field" x-field><label>{{ t("Year") }}</label>
              <input type="number" min="1900" max="2100" x-model="f.start_year"></div>
            <div class="field" x-field><label>{{ t("Volumes") }}</label>
              <input type="number" min="0" x-model="f.volumes_total"></div>
            <div class="field" x-field><label>{{ t("Chapters") }}</label>
              <input type="number" min="0" x-model="f.chapters_total"></div>
            <div class="field" x-field title="{{ t('Complete: count the collection as complete whatever the numbers say, e.g. for omnibus editions') }}"><label>{{ t("Collection") }}</label>
              <select x-model="f.collection_complete">
                <option value="auto">{{ t("Automatic") }}</option><option value="complete">{{ t("Complete") }}</option>
              </select></div>
            <div class="field" x-field title="{{ t('Which edition your files are from (regular, kanzenban, omnibus...). Automatic: worked out from the pages per volume and the editions MangaUpdates lists') }}"><label>{{ t("Edition") }}</label>
              <select x-model="f.edition_volumes">
                <template x-for="[v, label] in editions" :key="v"><option :value="v" x-text="label" :selected="v === f.edition_volumes"></option></template>
              </select></div>
            <div class="field wide" x-field><label>{{ t("Authors") }}</label> <small class="hint">{{ t("one per line: Name (Role)") }}</small>
              <textarea rows="3" x-model="f.authors"></textarea></div>
            <div class="field wide" x-field><label>{{ t("Genres") }}</label> <small class="hint">{{ t("comma separated") }}</small>
              <input x-model="f.genres"></div>
            <div class="field wide" x-field><label>{{ t("Tags") }}</label> <small class="hint">{{ t("comma separated") }}</small>
              <textarea rows="2" x-model="f.tags"></textarea></div>
            <div class="field wide" x-field><label>{{ t("Links") }}</label> <small class="hint">{{ t("one per line: Site | https://…") }}</small>
              <textarea rows="3" x-model="f.links"></textarea></div>
            <div class="btn-row wide">
              <button class="btn primary" type="submit" :disabled="saving" x-text="saving ? t('Saving…') : t('Save')"></button>
              <button class="btn" type="button" @click="close()">{{ t("Cancel") }}</button>
            </div>
          </form>

          <!-- poster -->
          <div class="poster-edit" data-tab-panel="poster" x-show="tab === 'poster'">
            <div class="poster-now">
              <img :src="preview || s.poster_large" alt="">
              <small class="muted" x-text="preview ? t('Preview (not saved yet)') : ({ upload: t('Uploaded by you'), page: t('A page from a book'),
                provider: t('Cover from {source}', { source: $store.app.providerName(s.metadata_source?.provider) }),
                first_page: t('Automatic: first page') }[s.poster_source] || '')"></small>
            </div>
            <div class="poster-options">
              <section>
                <h3>{{ t("Upload an image") }}</h3>
                <p class="muted">{{ t("JPEG, PNG, WebP, GIF or AVIF, up to 10 MB. The image is checked and saved as a new JPEG.") }}</p>
                <input type="file" x-ref="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,image/jxl,.jxl" @change="pickFile($event)">
                <div class="btn-row" x-show="file">
                  <button class="btn primary" :disabled="uploading" @click="upload()" x-text="uploading ? t('Uploading…') : t('Use this image')"></button>
                  <button class="btn" @click="clearFile()">{{ t("Cancel") }}</button>
                </div>
              </section>
              <section x-show="books.length">
                <h3>{{ t("Use a page from a book") }}</h3>
                <div class="page-pick">
                  <select x-model="pageBook">
                    <template x-for="b in books" :key="b.id"><option :value="b.id" :selected="b.id === +pageBook" x-text="b.label"></option></template>
                  </select>
                  <label>{{ t("Page") }} <input type="number" min="1" :max="pageBookObj?.page_count || 1" x-model="pageNo"></label>
                </div>
                <img class="page-preview" :src="pagePreview" alt="" loading="lazy">
                <button class="btn" @click="choose('page')">{{ t("Use this page") }}</button>
              </section>
              <section>
                <h3>{{ t("Other") }}</h3>
                <div class="btn-row">
                  <button class="btn" x-show="s.metadata_source" @click="choose('provider')"
                          x-text="t('Cover from {source}', { source: $store.app.providerName(s.metadata_source?.provider) })"></button>
                  <button class="btn" @click="choose('first_page')">{{ t("Automatic (first page)") }}</button>
                </div>
              </section>
            </div>
          </div>
        </div>
      </template>
      <p class="muted" x-show="!s">{{ t("Loading…") }}</p>
    </div>
  </div>
