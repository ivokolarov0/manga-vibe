<!-- the series page of a random pick: pick again without going back -->
<button type="button" class="btn ctl random-again" x-show="$store.randomManga.picked === s.id" x-cloak
        @click="$store.randomManga.pick(s.id)" :disabled="$store.randomManga.busy"
        :title="t('Open another series picked at random')">
  <svg class="ic" aria-hidden="true"><use href="#i-shuffle"/></svg>
  <span x-text="t('Pick another')"></span></button>
