<!-- open a series picked at random from the library shown (random_manga.js) -->
<button class="tool random-tool" @click="$store.randomManga.pick()" :disabled="$store.randomManga.busy"
        :title="t('Open a series picked at random')" :aria-label="t('Random series')">
  <svg class="ic" aria-hidden="true"><use href="#i-shuffle"/></svg>
  <span x-text="t('Random')"></span></button>
