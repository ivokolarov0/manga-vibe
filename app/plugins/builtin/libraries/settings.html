<!-- Settings → Libraries (#/settings/shelves): librarySettings in libraries.js. The words: t() (#263) -->
<section x-show="section === 'shelves'" x-data="librarySettings">
  <h2 x-text="t('Libraries')"></h2>
  <p class="muted" x-text="t('Each library shows its own series, picked with the tabs on the home screen. A folder\'s series show in its library (Settings → Library folders); one series can be moved to another with Edit, or several at once by holding a card. Files never move.')"></p>
  <template x-for="sh in store.list" :key="sh.id">
    <div class="lib-card shelf-card">
      <div class="libcard-head">
        <span class="libcard-icon" aria-hidden="true"
              x-html="icon(sh.has_password ? (sh.locked ? 'lock' : 'unlock') : 'books')"></span>
        <div class="libcard-title">
          <input type="text" class="shelf-name" :value="sh.name" maxlength="60" spellcheck="false"
                 :aria-label="t('Name of {name}', { name: sh.name })" @change="rename(sh, $event.target.value)"
                 @keydown.enter="$event.target.blur()">
          <small x-text="(sh.locked ? t('Locked') : tn('{n} series', '{n} series', sh.series)) + ' · ' + folders(sh)"></small>
        </div>
        <div class="row-buttons">
          <button class="btn small" x-show="sh.locked" @click="store.openUnlock(sh.id)" x-text="t('Unlock')"></button>
          <button class="btn small" x-show="sh.has_password && !sh.locked" @click="lock(sh)" x-text="t('Lock now')"></button>
          <button class="btn small danger" @click="remove(sh)" x-text="t('Delete')"></button>
        </div>
      </div>
      <label x-field class="lib-option">
        <span class="lib-option-text"><span x-text="t('Reading mode')"></span>
          <small x-text="t('For its series that don\'t set their own')"></small></span>
        <select :value="sh.reader_mode || 'default'" @change="patch(sh, { reader_mode: $event.target.value })"
                :aria-label="t('Reading mode for {name}', { name: sh.name })">
          <option value="default" x-text="t('Like Settings → Reader')"></option>
          <option value="paged" x-text="t('Pages')"></option>
          <option value="vertical" x-text="t('Vertical (webtoons)')"></option>
        </select></label>
      <div class="lib-option">
        <span class="lib-option-text"><span x-text="t('Password')"></span>
          <small x-text="sh.has_password ? t('Asked for when the library is opened. Its series are hidden everywhere until then.')
            : t('Optional: keeps this library private from others using the app')"></small></span>
        <button class="btn small" x-show="pw?.id !== sh.id" @click="openPassword(sh)"
                x-text="sh.has_password ? t('Change or remove…') : t('Set a password…')"></button>
      </div>
      <form class="password-form" x-show="pw?.id === sh.id" @submit.prevent="savePassword(sh)" x-cloak>
        <template x-if="pw?.id === sh.id">
          <div class="password-fields">
            <label x-show="sh.has_password"><span x-text="t('Current password')"></span>
              <input type="password" x-model="pw.current" autocomplete="current-password"></label>
            <label><span x-text="t('New password')"></span>
              <input type="password" x-model="pw.password" autocomplete="new-password" maxlength="200"></label>
            <label><span x-text="t('New password again')"></span>
              <input type="password" x-model="pw.again" autocomplete="new-password" maxlength="200"></label>
            <div class="btn-row">
              <button class="btn small primary" type="submit" x-text="t('Save password')"></button>
              <button class="btn small danger" type="button" x-show="sh.has_password" @click="savePassword(sh, true)" x-text="t('Remove password')"></button>
              <button class="btn small" type="button" @click="pw = null" x-text="t('Cancel')"></button>
            </div>
            <p class="muted" x-html="th('Forgot it? Start MangaVibe once with {setting}. The app has no accounts, so this keeps the library from others using it; anyone who can open the files or the database still can.',
                                       { setting: '<code>' + esc('CLEAR_LIBRARY_PASSWORD=' + sh.name) + '</code>' })"></p>
          </div>
        </template>
      </form>
    </div>
  </template>
  <div x-field class="setting-row">
    <div class="label"><span x-text="t('Add a library')"></span>
      <small x-text="t('For example Manga, Comics, Manhwa. Then point a folder at it, or move series to it. Just a set of filters (e.g. only Isekai)? Filter the home screen and use “Save search”.')"></small></div>
    <button class="btn small primary" @click="store.add()"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span x-text="t('New library')"></span></button>
  </div>
</section>
