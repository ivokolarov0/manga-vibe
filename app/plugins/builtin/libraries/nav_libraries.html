<!-- the libraries in the sidebar (the nav-items slot of the Sidebar plugin): the same as the tabs above the
     grid, which are hidden while the sidebar shows (libraries.css). Picking one from another page opens the
     library. The sidebar shows .nav-section only in its column, not in the bar on phones -->
<div class="nav-section nav-libraries" x-data x-show="$store.libraries.list.length" x-cloak
     role="group" aria-labelledby="nav-libraries-title">
  <div class="nav-section-head">
    <span id="nav-libraries-title" x-text="t('Libraries')"></span>
    <button type="button" x-show="$store.app.admin" @click="$store.libraries.addAndPick()" :title="t('New library')"
            :aria-label="t('New library')"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
  </div>
  <template x-for="s in [...($store.libraries.showAll ? [{ id: 0, name: t('All') }] : []), ...$store.libraries.list]" :key="s.id">
    <button type="button" class="nav-entry" :class="{ picked: $store.libraries.picked === s.id }"
            :aria-pressed="$store.libraries.picked === s.id" :title="s.locked ? t('Locked: asks for the password') : null"
            @click="$store.libraries.pick(s.id); if (!['library', 'continue'].includes($store.app.view)) location.hash = '#/library'">
      <span class="nav-ic"><svg class="ic" aria-hidden="true"><use :href="s.id ? '#i-books' : '#i-blocks'"/></svg></span>
      <span class="nav-label" x-text="s.name"></span>
      <span class="lock" x-show="s.has_password" x-html="icon(s.locked ? 'lock' : 'unlock')"
            role="img" :aria-label="s.locked ? t('locked') : t('unlocked')"></span>
    </button>
  </template>
  <button type="button" class="nav-entry nav-lock-now" x-show="$store.libraries.anyOpen" @click="$store.libraries.lockNow()"
          :title="t('Ask for the passwords again')">
    <span class="nav-ic"><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg></span><span class="nav-label" x-text="t('Lock now')"></span></button>
</div>
