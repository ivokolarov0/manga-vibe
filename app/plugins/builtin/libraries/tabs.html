<!-- the libraries: the library grid and Continue show the one picked here; + adds one. Not on Home: it shows
     every library, and its Libraries row opens one. x-tabs (the UI kit): manual, because picking a locked
     library asks for its password; + and Lock now aren't tabs (data-kit-skip) -->
<div class="tabs shelf-tabs" x-data x-tabs data-kit-options="{ manual: true }" :aria-label="t('Libraries')" x-cloak
     x-show="['library', 'continue'].includes($store.app.view) && $store.libraries.list.length">
  <button x-show="$store.libraries.showAll" :class="{ active: $store.libraries.picked === 0 }"
          @click="$store.libraries.choose(0)" x-text="t('All')"></button>
  <template x-for="s in $store.libraries.list" :key="s.id">
    <button :class="{ active: $store.libraries.picked === s.id }"
            @click="$store.libraries.choose(s.id)" :title="s.locked ? t('Locked: asks for the password') : ''">
      <span x-text="s.name"></span>
      <span class="lock" x-show="s.has_password" x-html="icon(s.locked ? 'lock' : 'unlock')"
            role="img" :aria-label="s.locked ? t('locked') : t('unlocked')"></span></button>
  </template>
  <button class="add" data-kit-skip x-show="$store.app.admin" @click="$store.libraries.addAndPick()" :title="t('New library')"
          :aria-label="t('New library')"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
  <button class="lock-now" data-kit-skip x-show="$store.libraries.anyOpen" @click="$store.libraries.lockNow()"
          :title="t('Ask for the passwords again')"><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg><span x-text="t('Lock now')"></span></button>
</div>
