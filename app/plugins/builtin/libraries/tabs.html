<!-- the libraries: the library grid, Continue and Home show the one picked here; + adds one -->
<div class="tabs shelf-tabs" x-data role="tablist" :aria-label="t('Libraries')" x-cloak
     x-show="['home', 'library', 'continue'].includes($store.app.view) && $store.libraries.list.length">
  <button role="tab" x-show="$store.libraries.showAll" :class="{ active: $store.libraries.picked === 0 }"
          :aria-selected="$store.libraries.picked === 0" @click="$store.libraries.pick(0)" x-text="t('All')"></button>
  <template x-for="s in $store.libraries.list" :key="s.id">
    <button role="tab" :class="{ active: $store.libraries.picked === s.id }" :aria-selected="$store.libraries.picked === s.id"
            @click="$store.libraries.pick(s.id)" :title="s.locked ? t('Locked: asks for the password') : ''">
      <span x-text="s.name"></span>
      <span class="lock" x-show="s.has_password" x-html="icon(s.locked ? 'lock' : 'unlock')"
            role="img" :aria-label="s.locked ? t('locked') : t('unlocked')"></span></button>
  </template>
  <button class="add" x-show="$store.app.admin" @click="$store.libraries.addAndPick()" :title="t('New library')"
          :aria-label="t('New library')"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
  <button class="lock-now" x-show="$store.libraries.anyOpen" @click="$store.libraries.lockNow()"
          :title="t('Ask for the passwords again')"><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg><span x-text="t('Lock now')"></span></button>
</div>
