{#- Missing chapters: one row per series. -#}
            <div class="att-rows">
              <template x-for="x in rows" :key="x.key">
                <div class="att-row" :class="{ ignored: x.ignored }">
                  <div class="what">
                    <a :href="'#/series/' + x.series_id"><b x-text="x.series"></b></a>
                    <span class="muted" x-text="x.gaps.length === 1 && !x.gaps[0].includes('–')
                      ? t('Missing chapter {chapters}', { chapters: x.gaps[0] }) : t('Missing chapters {chapters}', { chapters: x.gaps.join(', ') })"></span>
                  </div>
                  <button class="btn small" @click="ignore(x.key, !x.ignored)" x-text="x.ignored ? t('Restore') : t('Ignore')"></button>
                </div>
              </template>
            </div>
