{#- Duplicates: one card per chapter, the files side by side. -#}
            <div class="dup-list">
              <template x-for="d in rows" :key="d.key">
                <div class="dup-group" :class="{ ignored: d.ignored }">
                  <div class="dup-head">
                    <div class="dup-title">
                      <a :href="'#/series/' + d.series_id" class="dup-cover" :title="d.series"><img :src="d.cover" loading="lazy" alt=""></a>
                      <div><a :href="'#/series/' + d.series_id"><b x-text="d.series"></b></a>
                        <span class="chip" x-text="d.label"></span></div>
                    </div>
                    <div class="btn-row">
                      <button class="btn small" :class="{ busy: !!rescanning[d.series_id] }" :disabled="!!rescanning[d.series_id]" @click="rescan(d.series_id)"
                              title="Re-read this series' folder after fixing the files on disk">
                        <svg class="ic" x-show="!rescanning[d.series_id]" aria-hidden="true"><use href="#i-refresh"/></svg>
                        <span x-text="rescanning[d.series_id] ? 'Rescanning…' : 'Rescan'"></span></button>
                      <button class="btn small" @click="ignore(d.key, !d.ignored)"
                              x-text="d.ignored ? 'Restore' : 'Not a duplicate'"></button>
                    </div>
                  </div>
                  <div class="dup-files">
                    <template x-for="f in d.files" :key="f.book_id">
                      <div class="dup-file" :class="{ hidden: f.hidden }">
                        <a :href="'#/read/' + f.book_id"><img :src="f.thumbnail" loading="lazy" alt=""></a>
                        <div class="name" x-text="f.file"></div>
                        <div class="muted" x-text="`${f.page_count} pages · ${(f.file_size / 1048576).toFixed(1)} MB` + (f.revision > 1 ? ` · v${f.revision}` : '')"></div>
                        <div class="btn-row">
                          <a class="btn small" :href="'#/read/' + f.book_id">Open</a>
                          <button class="btn small" @click="hideFile(f)" x-text="f.hidden ? 'Show again' : 'Hide this one'"></button>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
