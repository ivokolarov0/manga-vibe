{#- Same match: one card per group of series matched to the same entry. -#}
            <div class="att-list">
              <template x-for="g in rows" :key="g.key">
                <div class="att-card" :class="{ ignored: g.ignored }">
                  <div class="att-card-head">
                    <span class="chip" x-text="sharedLabel(g)"></span>
                    <button class="btn small push" @click="ignore(g.key, !g.ignored)"
                            x-text="g.ignored ? t('Restore') : t('Not a problem')"></button>
                  </div>
                  <div class="att-rows">
                    <template x-for="m in g.members" :key="m.series_id">
                      <div class="att-row">
                        <div class="what">
                          <a :href="'#/series/' + m.series_id"><b x-text="m.series"></b></a>
                          <span class="muted" x-text="[m.library, tn('{n} book', '{n} books', m.books)].filter(Boolean).join(' · ')"></span>
                          <span class="muted break folder" x-text="m.folder"></span>
                        </div>
                        <div class="btn-row">
                          <a class="btn small" :href="'#/series/' + m.series_id">{{ t("Open") }}</a>
                          <button class="btn small" @click="fix(m)">{{ t("Fix match…") }}</button>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
