<!-- saved searches: a name for a set of filters and sort, e.g. Isekai -->
<div class="sheet saved-sheet" x-data="savedSearchesSheet" x-show="$store.app.sheet === 'saved-searches'" x-cloak
     @click.self="$store.app.sheet = null" @keydown.escape.window="$store.app.sheet = null">
  <div>
    <div class="sheet-head"><b>Saved searches</b>
      <span class="btn-row"><button class="btn small primary" x-show="store.canSave" @click="store.save()"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg>Save this search</button>
        <button class="btn small" @click="$store.app.sheet = null">Done</button></span></div>
    <div class="saved-empty" x-show="!store.items.length">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
      <b>No saved searches yet</b>
      <span>Pick filters (for example the tag Isekai) and a sort, then save them here.
        A saved search works in every library.</span>
    </div>
    <div class="saved-list">
      <template x-for="x in store.items" :key="x.id">
        <div class="saved-item" :class="{ on: isOn(x) }">
          <button class="saved-main" :aria-pressed="isOn(x)" @click="pick(x)"
                  :title="isOn(x) ? 'Shown now: tap to clear it' : 'Show these series'">
            <span class="saved-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></span>
            <span class="saved-text">
              <b x-text="x.name"></b>
              <span class="saved-pills"><template x-for="(p, i) in parts(x.query)" :key="i">
                <i x-text="p"></i></template></span>
            </span>
            <span class="saved-check" x-show="isOn(x)" aria-hidden="true"><svg class="ic"><use href="#i-check"/></svg></span>
          </button>
          <button class="saved-del" :aria-label="'Delete ' + x.name" title="Delete" @click="store.remove(x)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
      </template>
    </div>
  </div>
</div>
