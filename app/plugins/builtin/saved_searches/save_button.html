<!-- keep these filters and sort under a name (the Saved button lists them): the UI kit's small button, as a
     dashed pill (saved_searches.css) -->
<button class="btn small save-search" x-show="$store.savedSearches.canSave && !$store.savedSearches.current"
        @click="$store.savedSearches.save()"
        :title="t('Keep these filters under a name: the Saved button brings them back')">
  <svg class="ic" aria-hidden="true"><use href="#i-bookmark"/></svg>
  <span x-text="t('Save search')"></span></button>
