<!-- the account menu in the top bar: who's logged in, Change password, Log out -->
<div class="menu account-menu" x-show="$store.accounts.me" x-cloak @click.outside="$store.accounts.menuOpen = false"
     @keydown.escape="$store.accounts.menuOpen = false">
  <button class="iconbtn account-btn" @click="$store.accounts.menuOpen = !$store.accounts.menuOpen"
          :title="$store.accounts.me?.name" :aria-label="'Account: ' + $store.accounts.me?.name">
    <span x-text="($store.accounts.me?.name || '?').slice(0, 1).toUpperCase()"></span></button>
  <div class="menu-pop" x-show="$store.accounts.menuOpen" x-transition.opacity>
    <div class="account-who"><b x-text="$store.accounts.me?.name"></b>
      <small x-text="$store.accounts.me?.admin ? 'Admin' : 'Account'"></small></div>
    <button @click="$store.accounts.menuOpen = false; $store.accounts.pwOpen = true">
      <svg class="ic" aria-hidden="true"><use href="#i-key"/></svg>Change password…</button>
    <button @click="$store.accounts.logout()">
      <svg class="ic" aria-hidden="true"><use href="#i-log-out"/></svg>Log out</button>
  </div>
</div>
