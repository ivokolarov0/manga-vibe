<!-- the account menu in the top bar: who's logged in, Change password, Log out -->
<div class="menu account-menu" x-show="$store.accounts.me" x-cloak x-menu="$store.accounts.menuOpen">
  <button class="iconbtn account-btn"
          :title="$store.accounts.me?.name" :aria-label="t('Account: {name}', { name: $store.accounts.me?.name })">
    <span x-text="($store.accounts.me?.name || '?').slice(0, 1).toUpperCase()"></span></button>
  <div class="menu-pop" x-show="$store.accounts.menuOpen" x-transition.opacity>
    <div class="account-who"><b x-text="$store.accounts.me?.name"></b>
      <small x-text="$store.accounts.me?.admin ? t('Admin') : t('Account')"></small></div>
    <button @click="$store.accounts.menuOpen = false; $store.accounts.pwOpen = true">
      <svg class="ic" aria-hidden="true"><use href="#i-key"/></svg><span x-text="t('Change password…')"></span></button>
    <button @click="$store.accounts.logout()">
      <svg class="ic" aria-hidden="true"><use href="#i-log-out"/></svg><span x-text="t('Log out')"></span></button>
  </div>
</div>
