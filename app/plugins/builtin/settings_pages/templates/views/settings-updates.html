        <!-- updates -->
        <section x-show="section === 'updates'">
          <h2>{{ t("Updates") }}</h2>
          <template x-if="upd && !upd.supported">
            <p class="muted">{{ t("Updates work only in the MangaVibe Docker image. Here, update with git.") }}</p>
          </template>
          <div x-field class="setting-row">
            <div class="label"><span>{{ t("Running version") }}</span><small x-text="versionText(upd?.current)"></small></div>
          </div>
          <label x-field class="setting-row"><span class="label"><span>{{ t("Check for updates every day") }}</span><small x-text="t('Asks GitHub ({repo}) for its newest release and shows a message when one is out', { repo: upd?.repo || '' })"></small></span>
            <select x-model="st.auto_update" @change="save('auto_update')"><option value="true">{{ t("On") }}</option><option value="false">{{ t("Off") }}</option></select></label>
          <div x-field class="setting-row">
            <div class="label">
              <span x-text="upd?.available ? t('New version: {version}', { version: upd.available.short }) : t('You have the newest version')"></span>
              <small x-show="upd?.available" x-text="versionText(upd?.available)"></small>
              <small x-show="upd?.available?.notes" x-text="upd?.available?.notes"></small>
              <ul class="release-changes" x-show="upd?.available?.changes?.length">
                <template x-for="c in upd?.available?.changes || []"><li x-text="c"></li></template>
              </ul>
              <small x-show="upd?.available?.url"><a :href="upd?.available?.url" target="_blank" rel="noopener">{{ t("Full release notes") }}<svg class="ic" aria-hidden="true"><use href="#i-external"/></svg></a></small>
              <small x-text="checkedText"></small>
            </div>
            <button class="btn small" :disabled="checking || !upd?.supported" @click="checkUpdate()"
                    x-text="checking ? t('Checking…') : t('Check now')"></button>
          </div>
          <template x-if="upd?.available">
            <div x-field class="setting-row">
              <div class="label">
                <span x-show="upd.available.needs_image">{{ t("This version needs a new Docker image") }}</span>
                <span x-show="!upd.available.needs_image && upd.available.failed">{{ t("This version did not start, so MangaVibe went back") }}</span>
                <span x-show="!upd.available.needs_image && !upd.available.failed && upd.available.skipped">{{ t("You skipped this version") }}</span>
                <span x-show="!upd.available.needs_image && !upd.available.failed && !upd.available.skipped">{{ t("Ready to install") }}</span>
                <small x-show="upd.available.needs_image">{{ t("Files alone are not enough for it. See {url}", url="github.com/ivokolarov0/manga-vibe#updating") }}</small>
                <small x-show="!upd.available.needs_image">{{ t("Your library, progress and settings are kept. The app restarts by itself.") }}</small>
              </div>
              <div class="btn-row">
                <button class="btn small" x-show="upd.available.skipped" @click="unskipUpdate()">{{ t("Don't skip") }}</button>
                <button class="btn small" x-show="!upd.available.skipped" @click="skipUpdate()">{{ t("Skip this version") }}</button>
                <button class="btn small primary" x-show="!upd.available.needs_image" :disabled="!!$store.app.updating"
                        @click="installUpdate()" x-text="upd.available.failed ? t('Try again') : t('Update now')"></button>
              </div>
            </div>
          </template>
          <!-- going back (GET /api/update/versions asks GitHub, so only on a press) -->
          <div x-field class="setting-row" x-show="upd?.supported">
            <div class="label">
              <span>{{ t("Go back to an earlier version") }}</span>
              <small>{{ t("If a new version has a problem. The version you leave isn't offered again until a newer one is out.") }}</small>
              <small x-show="olderError" x-text="olderError"></small>
            </div>
            <button class="btn small" :disabled="loadingOlder" @click="loadOlder()"
                    x-text="loadingOlder ? t('Loading…') : older ? t('Look again') : t('Show versions')"></button>
          </div>
          <template x-if="older && !older.length">
            <p class="muted">{{ t("No earlier version found.") }}</p>
          </template>
          <template x-for="v in older || []" :key="v.sha">
            <div x-field class="setting-row">
              <div class="label"><span x-text="v.short"></span><small x-text="olderText(v)"></small></div>
              <div class="btn-row">
                <a class="btn small" x-show="v.url" :href="v.url" target="_blank" rel="noopener">{{ t("Notes") }}<svg class="ic" aria-hidden="true"><use href="#i-external"/></svg></a>
                <button class="btn small" :disabled="!!$store.app.updating" @click="goBack(v)">{{ t("Go back") }}</button>
              </div>
            </div>
          </template>
        </section>
