        <!-- library folders -->
        <section x-show="section === 'library'">
          <h2>{{ t("Library folders") }}</h2>
          <template x-for="l in libs" :key="l.id">
            <div class="lib-card" :class="{ missing: !l.available }">
              <div class="libcard-head">
                <span class="libcard-icon" aria-hidden="true"><svg class="ic"><use href="#i-folder"/></svg></span>
                <div class="libcard-title">
                  <strong x-text="l.name"></strong>
                  <small x-text="[l.root_path, tn('{n} series', '{n} series', l.series), l.available ? '' : t('not found, check the volume mount')].filter(Boolean).join(' · ')"></small>
                  <small class="scan-progress" x-show="libScanText(l)" x-text="libScanText(l)"></small>
                </div>
                <div class="row-buttons">
                  <button class="btn small" :disabled="!!scan.running" @click="rescan(l)"
                          :title="scan.running ? t('A scan is running') : t('Scan only this folder')"><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg>{{ t("Scan") }}</button>
                  <button class="btn small danger" @click="removeLibrary(l)">{{ t("Remove") }}</button>
                </div>
              </div>
              <!-- what plugins add for each folder (they can use l), e.g. its library -->
              {{ slot("folder-row") }}
              <label class="lib-option">
                <span class="lib-option-text"><span>{{ t("Path outside Docker") }}</span>
                  <small>{{ t("What {path} is on your NAS or computer, e.g. {example1} or {example2}. The series page shows and copies it.",
                              path='<code x-text="l.root_path"></code>'|safe, example1='<code class="ex">/volume1/manga</code>'|safe,
                              example2='<code class="ex">\\\\NAS\\manga</code>'|safe) }}</small></span>
                <input type="text" class="host-path" :value="l.host_path || ''" placeholder="/volume1/manga"
                       spellcheck="false" autocomplete="off" @change="setLibraryHostPath(l, $event.target.value)"
                       @keydown.enter="$event.target.blur()" :aria-label="t('Path outside Docker for {name}', { name: l.name })"></label>
            </div>
          </template>
          <div class="setting-row">
            <div class="label"><span>{{ t("Add a folder") }}</span>
              <small>{{ t("Only folders mounted in the container are visible (e.g. /library2).") }}</small></div>
            <button class="btn small primary" @click="$store.app.folderPicker = true"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg>{{ t("Add folder") }}</button>
          </div>
          <div class="setting-row">
            <div class="label"><span x-text="scanText || t('Scan for new files')"></span>
              <small>{{ t("Runs by itself every 6 hours and on start.") }}</small></div>
            <button class="btn small" :class="{ busy: !!scan.running }" :disabled="!!scan.running" @click="rescan()">{{ t("Rescan all") }}</button>
          </div>
        </section>
