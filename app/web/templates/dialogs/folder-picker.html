  <!-- ============ folder picker ============ -->
  <div class="modal" x-data="folderPicker()" x-show="$store.app.folderPicker" x-cloak
       x-dialog="close()">
    <div>
      <div class="sheet-head"><b>{{ t("Add a library folder") }}</b><button class="btn small" @click="close()">{{ t("Cancel") }}</button></div>
      <p class="muted">{{ t("These are the folders inside the MangaVibe container. To see another folder here, first mount it into the container as a volume, then restart it.") }}</p>
      <div class="chips" x-show="crumbs.length">
        <template x-for="c in crumbs" :key="c.path">
          <button class="chip-btn" @click="open(c.path)" x-text="c.name"></button>
        </template>
      </div>
      <p class="err" role="alert" x-show="error" x-text="error"></p>
      <div class="folder-list">
        <button x-show="parent !== null && path" @click="open(parent)"><svg class="ic" aria-hidden="true"><use href="#i-arrow-up"/></svg> <span>{{ t("Up") }}</span></button>
        <template x-for="d in dirs" :key="d.path">
          <button @click="open(d.path)"><svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg> <span x-text="d.name"></span>
            <small class="muted" x-show="d.library">{{ t("(already a library)") }}</small></button>
        </template>
        <p class="muted" style="margin: 0; padding: 10px 12px" x-show="path && !dirs.length">{{ t("No folders inside.") }}</p>
      </div>
      <div class="row" x-show="path">
        <div class="folder-path" style="flex: 1" x-text="path"></div>
        <button class="btn primary" :disabled="busy" @click="choose()">{{ t("Use this folder") }}</button>
      </div>
    </div>
  </div>
