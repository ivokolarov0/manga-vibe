    <!-- ============ continue reading ============ -->
    <section class="view" x-data="continueView()" x-show="$store.app.view === 'continue'" x-cloak>
      <h2>Continue reading</h2>
      {{ slot("continue-top") }}
      <div class="grid">
        <template x-for="s in items || []" :key="s.id">
          <a class="card" :href="'#/series/' + s.id">
            {{ view("card", layout="continue") }}
          </a>
        </template>
      </div>
      <div class="empty" x-show="items && !items.length">
        <svg class="ic" aria-hidden="true"><use href="#i-book-open"/></svg>
        <span>Nothing in progress. Start a series and it shows up here.</span>
        <a class="btn small primary" href="#/">Open the Library</a>
      </div>
    </section>
