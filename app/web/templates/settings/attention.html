{% from "ui/macros.html" import meta_progress %}
        <!-- needs attention -->
        <section class="att" x-data="attentionView()" x-show="kind" x-cloak>
          <div class="att-head">
            <h2 x-text="title"></h2>
            <button class="link-btn" x-show="ignoredCount || $store.app.showIgnored" @click="toggleIgnored()"
                    x-text="$store.app.showIgnored ? 'Hide ignored rows' : `Show ${ignoredCount} ignored`"></button>
          </div>
          <p class="muted" x-text="help"></p>
          <!-- what plugins say about these lists, e.g. "only Manga, the library picked on the home screen" -->
          {{ slot("attention-note") }}
          <div class="empty" x-show="a && !rows.length">
            <svg class="ic" aria-hidden="true"><use href="#i-check-circle"/></svg>
            <span>Nothing here. All good.</span>
          </div>

          <!-- errors / not supported: grouped by series -->
          <template x-if="a && (kind === 'unreadable' || kind === 'unsupported')">
            <div class="att-list">
              <template x-for="g in groups(kind)" :key="g.series_id">
                <div class="att-card">
                  <div class="att-card-head">
                    <a :href="'#/series/' + g.series_id"><b x-text="g.series"></b></a>
                    <span class="muted" x-text="`${g.files.length} ${g.files.length === 1 ? 'file' : 'files'}`"></span>
                    <button class="btn small push" x-show="g.files.length > 1 && g.files.some((f) => !f.ignored)"
                            @click="ignoreAll(g)" x-text="`Ignore all ${g.files.length}`"></button>
                  </div>
                  <div class="err" x-show="g.sameError" x-text="g.files[0].error"></div>
                  <details :open="g.files.length <= 4">
                    <summary class="muted" x-show="g.files.length > 4" x-text="`Show ${g.files.length} files`"></summary>
                    <div class="att-rows">
                      <template x-for="f in g.files" :key="f.key">
                        <div class="att-row" :class="{ ignored: f.ignored }">
                          <div class="what">
                            <span class="name" x-text="f.file"></span>
                            <span class="err" x-show="!g.sameError" x-text="f.error"></span>
                          </div>
                          <button class="btn small" @click="ignore(f.key, !f.ignored)" x-text="f.ignored ? 'Restore' : 'Ignore'"></button>
                        </div>
                      </template>
                    </div>
                  </details>
                  <div class="muted break folder" x-text="g.folder"></div>
                </div>
              </template>
            </div>
          </template>

          <!-- metadata matches -->
          <template x-if="a && kind === 'matches'">
            <div>
              {{ meta_progress() }}
              <template x-for="x in a.matches" :key="x.series_id">
                <div class="item">
                  <div class="cand own">
                    <a :href="'#/series/' + x.series_id" :title="x.series"><img :src="x.cover" loading="lazy" alt=""></a>
                    <div class="info"><a :href="'#/series/' + x.series_id"><b x-text="x.series"></b></a>
                      <span class="muted" x-text="'Your copy · folder: ' + x.folder"></span></div>
                  </div>
                  <template x-for="c in x.candidates" :key="c.provider + c.provider_id">
                    <div class="cand">
                      <img :src="c.cover_url" x-show="c.cover_url" loading="lazy" alt="">
                      <div class="info"><b x-text="c.title"></b>
                        <span x-text="[c.year, c.format].filter(Boolean).join(' · ')"></span> ·
                        <span class="score" :class="scoreCls(c.score)" x-text="c.score + '%'"></span> ·
                        <span x-text="$store.app.providerName(c.provider)"></span></div>
                      <button class="btn small" :class="{ busy: isMatching(x, c) }" :disabled="isMatching(x)"
                              @click="use(x, c)" x-text="isMatching(x, c) ? 'Matching…' : 'Use'"></button>
                    </div>
                  </template>
                  <div class="row">
                    <button class="btn small" :disabled="isMatching(x)" @click="fix(x)">Fix match…</button>
                    <button class="btn small" :disabled="isMatching(x)" @click="dontMatch(x)">Don't match</button>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <!-- series matched to the same entry: one card per group -->
          <template x-if="a && kind === 'same'">
            <div class="att-list">
              <template x-for="g in a.same" :key="g.key">
                <div class="att-card" :class="{ ignored: g.ignored }">
                  <div class="att-card-head">
                    <span class="chip" x-text="sharedLabel(g)"></span>
                    <button class="btn small push" @click="ignore(g.key, !g.ignored)"
                            x-text="g.ignored ? 'Restore' : 'Not a problem'"></button>
                  </div>
                  <div class="att-rows">
                    <template x-for="m in g.members" :key="m.series_id">
                      <div class="att-row">
                        <div class="what">
                          <a :href="'#/series/' + m.series_id"><b x-text="m.series"></b></a>
                          <span class="muted" x-text="[m.library, `${m.books} ${m.books === 1 ? 'book' : 'books'}`].filter(Boolean).join(' · ')"></span>
                          <span class="muted break folder" x-text="m.folder"></span>
                        </div>
                        <div class="btn-row">
                          <a class="btn small" :href="'#/series/' + m.series_id">Open</a>
                          <button class="btn small" @click="fix(m)">Fix match…</button>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <!-- duplicates: one card per chapter, the files side by side -->
          <template x-if="a && kind === 'duplicates'">
            <div class="dup-list">
              <template x-for="d in a.duplicates" :key="d.key">
                <div class="dup-group" :class="{ ignored: d.ignored }">
                  <div class="dup-head">
                    <div class="dup-title">
                      <a :href="'#/series/' + d.series_id" class="dup-cover" :title="d.series"><img :src="d.cover" loading="lazy" alt=""></a>
                      <div><a :href="'#/series/' + d.series_id"><b x-text="d.series"></b></a>
                        <span class="chip" x-text="d.label"></span></div>
                    </div>
                    <div class="btn-row">
                      <button class="btn small" :class="{ busy: !!rescanning[d.series_id] }" :disabled="!!rescanning[d.series_id]" @click="rescan(d.series_id)"
                              title="Re-read this series' folder after fixing the files on disk">
                        <svg class="ic" x-show="!rescanning[d.series_id]" aria-hidden="true"><use href="#i-refresh"/></svg>
                        <span x-text="rescanning[d.series_id] ? 'Rescanning…' : 'Rescan'"></span></button>
                      <button class="btn small" @click="ignore(d.key, !d.ignored)"
                              x-text="d.ignored ? 'Restore' : 'Not a duplicate'"></button>
                    </div>
                  </div>
                  <div class="dup-files">
                    <template x-for="f in d.files" :key="f.book_id">
                      <div class="dup-file" :class="{ hidden: f.hidden }">
                        <a :href="'#/read/' + f.book_id"><img :src="f.thumbnail" loading="lazy" alt=""></a>
                        <div class="name" x-text="f.file"></div>
                        <div class="muted" x-text="`${f.page_count} pages · ${(f.file_size / 1048576).toFixed(1)} MB` + (f.revision > 1 ? ` · v${f.revision}` : '')"></div>
                        <div class="btn-row">
                          <a class="btn small" :href="'#/read/' + f.book_id">Open</a>
                          <button class="btn small" @click="hideFile(f)" x-text="f.hidden ? 'Show again' : 'Hide this one'"></button>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <!-- missing chapters -->
          <template x-if="a && kind === 'gaps'">
            <div class="att-rows">
              <template x-for="x in a.gaps" :key="x.key">
                <div class="att-row" :class="{ ignored: x.ignored }">
                  <div class="what">
                    <a :href="'#/series/' + x.series_id"><b x-text="x.series"></b></a>
                    <span class="muted" x-text="'Missing ' + (x.gaps.length === 1 && !x.gaps[0].includes('–') ? 'chapter ' : 'chapters ') + x.gaps.join(', ')"></span>
                  </div>
                  <button class="btn small" @click="ignore(x.key, !x.ignored)" x-text="x.ignored ? 'Restore' : 'Ignore'"></button>
                </div>
              </template>
            </div>
          </template>
        </section>
